general_plotting:
    context: notebook
    style: white
    palette: tab10
    font: sans-serif
    font_scale: 1.4
    color_codes: False
    rc:
        figure.frameon: True
        axes.grid: False
        axes.spines.top: False
        axes.spines.right: False
        axes.labelsize: 25
        xtick.top: False
        xtick.bottom: True
        ytick.left: True
        ytick.right: False
        xtick.direction: in
        ytick.direction: in
        font.weight: normal 
        font.family : Helvetica
        savefig.dpi: 300
        savefig.transparent: False
        #mathtext.default: regular
colors:
    palette: Paired
    extraColors:
        - (1,1,1)
        - (1,0,1)
        - (0,0,1)
        - (0, .5, 1)
        - (.6, .5, 1)
        - (1, .5, 1)
        - (.6, .5, .2)
