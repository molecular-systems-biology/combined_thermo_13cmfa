settings_scatterplots:
    marker: o
    s: 62.5 ## for 2.5,2.5 fig
    edgecolor: black
    
settings_errorbars:
    marker: o
    markersize: 15
    markeredgecolor: black
    elinewidth: 3
    capsize: 5
    linestyle: ''
settings_scatter_pyplot:
    marker: o
    markersize: 15
    markeredgecolor: black
    linestyle: ''
settings_pointplots:
    linestyles: '-'
    scale: 1.5
    capsize: 0.2
    errwidth: 3
    ci: sd
settings_barplots:
    edgecolor: black
    capsize: 0.2
    errwidth: 2
    ci: sd
settings_stackedbars:
    edgecolor: black
    capsize: 4
    alpha: 0.7
settings_clustermap:
    method: average
    col_cluster: False
    linewidths: 1
    linecolor: white
    cmap: coolwarm
    robust: True
    fmt: .2f
    annot_kws: 
    fontsize: 12
settings_diagonal:
    linestyle: '--'
    color: gray
settings_line:
    linestyle: '-'
    linewidth: 3

#import cycle 
#cc=cycler(linestyle=cfg['linestyle_cycler'])
#ax.set_prop_cycle(cc)
linestyle_cycler: ['-', '--', '-.', ':']
